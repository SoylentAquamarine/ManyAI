name: Weekly Model Health Check

# Runs every Monday at 08:00 UTC.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:        # manual trigger button in GitHub UI

jobs:
  check-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the commit back

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # ── Node setup (for eas update) ──────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── Test all models ──────────────────────────────────────────────────────
      - name: Test all provider models
        env:
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY:   ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          COHERE_API_KEY:      ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_API_KEY:   ${{ secrets.FIREWORKS_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_KEY:  ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python scripts/test_models.py

      # ── Patch providers.ts if any models are permanently dead ────────────────
      - name: Patch providers.ts (remove dead models)
        id: patch
        run: |
          python scripts/patch_providers.py
          echo "changed=$?" >> $GITHUB_OUTPUT
        # exit 1 = changes made, exit 0 = nothing changed — don't fail the job
        continue-on-error: true

      # ── Always regenerate public/config.json from providers.ts ───────────────
      - name: Regenerate public/config.json
        id: genconfig
        run: |
          python scripts/generate_config.py
          echo "changed=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── Commit + push if anything changed ────────────────────────────────────
      - name: Commit updated files
        if: steps.patch.outputs.changed == '1' || steps.genconfig.outputs.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/providers.ts public/config.json
          git commit -m "chore: sync providers and config (weekly auto-check)"
          git push

      # ── Push OTA only when providers.ts changed (dead models removed) ────────
      - name: Push OTA update
        if: steps.patch.outputs.changed == '1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx eas update --branch production --message "Weekly model cleanup — removed deprecated models"

      # ── Write job summary ────────────────────────────────────────────────────
      - name: Write summary
        if: always()
        run: |
          echo "## Weekly Model Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.patch.outputs.changed }}" == "1" ]; then
            echo "**providers.ts:** Dead models removed — OTA update pushed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**providers.ts:** No changes — all models alive." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.genconfig.outputs.changed }}" == "1" ]; then
            echo "**config.json:** Regenerated and committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**config.json:** Already up to date." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          with open('scripts/test_results.json') as f:
              d = json.load(f)
          print(f'Passed: {len(d[\"passed\"])}')
          print(f'Failed: {len(d[\"failed\"])}')
          if d['failed']:
              print()
              print('Failed models:')
              for e in d['failed']:
                  print(f'  {e[\"provider\"]}/{e[\"model\"]}: {e[\"response\"][:60]}')
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
